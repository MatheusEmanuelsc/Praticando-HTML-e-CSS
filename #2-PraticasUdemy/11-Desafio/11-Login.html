<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="">
        <fieldset>
            <legend>login</legend>

            <div class="form-group">
                <label for="user">Usuário</label>
                <input 
                    type="text"
                    id="user" 
                    name="user"
                    minlength="3" 
                    required
                    placeholder="Digite o seu usuário">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input 
                    type="password"
                    id="password" 
                    name="password"
                    minlength="6"
                    required
                    placeholder="Digite sua senha">
            </div>

            <div class="links-group">
                <div class="opc-group">
                    <button type="submit">login</button>
                    <a href="11-Cadastro.html">cadastre-se</a>
                </div>
                <a href="" class="recovery">esqueci minha senha</a>
            </div>
        </fieldset>
    </form>
</body>
</html>
