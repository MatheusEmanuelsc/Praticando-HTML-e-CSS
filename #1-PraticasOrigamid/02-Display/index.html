<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Carros e Bicicletas
    </title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <h1>
            Carros e Bicicletas
        </h1>
    </header>

    <main>
        <section>
            <header>
                <h2>Carro: <strong class="price"> R$ 1999</strong> </h2>
            </header>
            <p class="text">Carro modelo <em class="Feature"> 2045</em> , com <em class="Feature">200km</em> rodados.</p>

            <a class="btn" href="#">Comprar Carro</a>
        </section>

        <section>
            <header>
                <h2>Bicicleta:<strong class="price"> R$ 199</strong> </h2>
            </header>
            <p class="text">Bicicleta modelo <em class="Feature"> 2050</em> , com <em class="Feature">20km</em> rodados.</p>

            <a class="btn" href="#">Comprar Bicicleta</a>
        </section>
    </main>
</body>
</html>
